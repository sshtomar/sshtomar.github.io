---
layout: default
title: Home
---

<section class="hero-section animate-in">
  <hr class="hero-rule">
  <h1 class="hero-title">Shubham Tomar</h1>
  <p class="hero-subtitle">Machine Learning Engineer exploring the intersection of AI, product, and craft.</p>
</section>

<section id="writing" class="writing-section animate-in delay-1">
  <h2 class="section-heading">Writing</h2>
  <ul class="post-list">
    {% for post in site.posts %}
    <li>
      <a href="{{ post.url | relative_url }}">
        <span class="post-title">{{ post.title }}</span>
        <span class="post-date">{{ post.date | date: "%b %Y" }}</span>
      </a>
    </li>
    {% endfor %}
  </ul>
</section>
