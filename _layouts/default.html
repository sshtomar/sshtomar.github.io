<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} – {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>

  <!-- Styles -->
  <link rel="stylesheet" href="/assets/css/custom.css">

  {% seo %}
  {% feed_meta %}
</head>
<body>
  <!-- Navigation — fixed top-left -->
  <nav class="site-nav">
    {% if page.layout == "post" %}
    <a href="/" class="back-link">&larr; Home</a>
    {% else %}
    <a href="/" class="nav-name">{{ site.title }}</a>
    <div class="nav-links">
      <a href="/" {% if page.url == "/" %}class="active"{% endif %}>Home</a>
      <a href="/reading" {% if page.url == "/reading/" or page.url == "/reading" %}class="active"{% endif %}>Reading</a>
      <a href="/about" {% if page.url == "/about/" or page.url == "/about" %}class="active"{% endif %}>About</a>
    </div>
    {% endif %}
  </nav>

  <!-- Main Content -->
  <main class="main-content">
    <div class="content-wrapper">
      {{ content }}
    </div>

    <footer class="content-footer">
      <p>&copy; {{ site.time | date: '%Y' }} {{ site.author }}</p>
    </footer>
  </main>

  <script>
    // Smooth scroll for anchor links
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function(e) {
        e.preventDefault();
        const target = document.querySelector(this.getAttribute('href'));
        if (target) {
          target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      });
    });
  </script>
</body>
</html>
